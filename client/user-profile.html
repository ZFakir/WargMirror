<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WARG – User Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/profile.css" />
</head>
<body>

<!-- Overlay backdrop for mobile drawers -->
<div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>

<div class="app-shell" id="app-shell">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar__header">
      <button class="sidebar__close-btn" id="btn-sidebar-close" aria-label="Close navigation" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Primary">
      <a href="home.html" id="nav-discover" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span class="nav-item__label">Discover</span>
      </a>
      
      <a href="catalogue.html" id="nav-library" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="nav-item__label">My Library</span>
        <span class="nav-item__badge" id="nav-library-badge" style="display:none">0</span>
      </a>

      <a href="studio.html" id="nav-creator-studio" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span class="nav-item__label">Creator Studio</span>
      </a>
      <a href="user-profile.html" id="nav-account" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-item__label">Account</span>
      </a>
    </nav>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar" role="banner">
    <button class="icon-btn topbar__hamburger" id="btn-sidebar-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar__brand">
      <div class="topbar__logo" aria-hidden="true">W</div>
      <span class="topbar__wordmark">WARG</span>
    </div>
    <div class="topbar__search" role="search">
      <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="search"
        id="search-input"
        placeholder="Search games, creators, locations…"
        aria-label="Search games"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div class="topbar__actions">
      <button class="avatar-btn" id="btn-profile" title="My Profile">
        <img src="https://api.dicebear.com/9.x/identicon/svg?seed=WARGPlayer&backgroundColor=1a1816" alt="Player avatar" />
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="main-content">
    <div class="main-content__inner">
      <div class="profile-container">
        
        <!-- Profile Header -->
        <div class="profile-header">
          <div class="profile-banner"></div>
          <div class="profile-info">
            <div class="profile-picture-container">
              <img id="profile-avatar" src="https://api.dicebear.com/9.x/identicon/svg?seed=WARGPlayer&backgroundColor=1a1816" alt="Player avatar" class="profile-picture" />
              <button class="edit-icon profile-picture-edit" aria-label="Edit profile picture">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </button>
            </div>
            <div class="profile-details">
              <div class="profile-name-row">
                <h1 class="profile-name" id="profile-name">Loading…</h1>
                <button class="edit-icon" aria-label="Edit name">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
              </div>
              <div class="profile-title" id="profile-title">
                Player
              </div>
            </div>
          </div>
        </div>

        <!-- Stats Section -->
        <div class="profile-stats-grid" id="profile-stats-grid">
          <div class="stat-card">
            <div class="stat-header">
              <h2 class="stat-title">Total Points</h2>
            </div>
            <p class="stat-value" id="stat-total-points">—</p>
          </div>
          <div class="stat-card">
            <div class="stat-header">
              <h2 class="stat-title">Games Completed</h2>
            </div>
            <p class="stat-value" id="stat-games-completed">—</p>
          </div>
          <div class="stat-card">
            <div class="stat-header">
              <h2 class="stat-title">Distance Walked</h2>
            </div>
            <p class="stat-value" id="stat-distance-walked">—</p>
          </div>
        </div>

        <!-- Badges Section -->
        <div class="profile-section">
          <div class="section-header">
            <h2 class="section-title">Badges Earned</h2>
          </div>
          <div class="badges-grid" id="profile-badges-grid">
            <!-- Badges populated dynamically by user-profile.js -->
          </div>
        </div>

        <!-- My Library Section -->
        <div class="profile-section">
          <div class="section-header">
            <h2 class="section-title">My Library</h2>
          </div>
          <div class="card-grid" id="profile-library-grid">
            <!-- Games populated dynamically by user-profile.js -->
          </div>
        </div>

      </div>
    </div>
  </main>

</div>
<script src="scripts/api.js"></script>
<script src="scripts/components/GameCard.js"></script>
<script src="scripts/home.js"></script>
<script src="scripts/user-profile.js"></script>
</body>
</html>
