<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WARG – Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/login.css" />
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">W</div>
        <h1>Create an Account</h1>
        <p>Join the adventure across campus.</p>
      </div>
      <form class="login-form" id="signup-form" action="home.html">
        
        <!-- Avatar Section -->
        <div class="avatar-section">
          <label>Profile Picture (Optional)</label>
          <div class="avatar-preview-container">
            <img id="avatar-preview" src="https://api.dicebear.com/9.x/pixel-art/svg?seed=WARG" alt="Avatar Preview" />
            <input type="file" id="avatar-upload" accept="image/*" hidden />
            <button type="button" class="btn-icon" id="btn-upload-avatar" title="Upload Image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </button>
          </div>
          <div class="avatar-options">
            <p>Or choose a starter avatar:</p>
            <div class="avatar-grid" id="avatar-grid">
              <!-- JS will populate -->
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="PlayerOne" required minlength="3" maxlength="20" />
          <span class="error-msg" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="student@wits.ac.za" required />
          <span class="error-msg" id="email-error"></span>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
          <span class="error-msg" id="password-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-signup">Sign Up</button>
        </div>

        <div class="form-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </form>
    </div>
  </main>
  <script src="scripts/signup.js"></script>
</body>
</html>
