<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WARG – Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/login.css" />
  <script src="scripts/config.js"></script>
  <script>
    (function() {
      var savedTheme = localStorage.getItem("warg_theme");
      if (savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
      var savedContrast = localStorage.getItem("warg_contrast");
      if (savedContrast === "high") {
        document.documentElement.setAttribute("data-contrast", "high");
      }
    })();
  </script>
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <img src="assets/warg-logo.png" alt="WARG Logo" class="logo__img" />
        </div>
        <h1>Create an Account</h1>
        <p>Join the adventure across campus.</p>
      </div>
      <form class="login-form" id="signup-form" action="home.html">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="PlayerOne" autocomplete="username" aria-required="true" aria-describedby="username-error" required minlength="3" maxlength="20" />
          <span class="error-msg" id="username-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="student@wits.ac.za" autocomplete="email" aria-required="true" aria-describedby="email-error" required />
          <span class="error-msg" id="email-error" role="alert"></span>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" aria-required="true" aria-describedby="password-error" required minlength="6" />
          <span class="error-msg" id="password-error" role="alert"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-signup">Sign Up</button>
        </div>

        <div class="form-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </form>
    </div>
  </main>
  
  <script src="scripts/signup.js"></script>
</body>
</html>
