<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>WARG – Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/login.css" />
  <script src="scripts/config.js"></script>
  <script>
    (function() {
      var savedTheme = localStorage.getItem("warg_theme");
      if (savedTheme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
      var savedContrast = localStorage.getItem("warg_contrast");
      if (savedContrast === "high") {
        document.documentElement.setAttribute("data-contrast", "high");
      }
    })();
  </script>
  <style>
    .reset-message {
      display: none;
      padding: var(--space-3);
      margin-top: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-body-sm);
      line-height: 1.5;
    }
    .reset-message--success {
      display: block;
      background: rgba(82, 196, 26, 0.1);
      border: 1px solid rgba(82, 196, 26, 0.3);
      color: #52c41a;
    }
    .reset-message--error {
      display: block;
      background: rgba(255, 77, 79, 0.1);
      border: 1px solid rgba(255, 77, 79, 0.3);
      color: var(--color-danger);
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <img src="assets/warg-logo.png" alt="WARG Logo" class="logo__img" />
        </div>
        <h1>Reset Password</h1>
        <p id="reset-subtitle">Request a reset link for your account.</p>
      </div>

      <!-- Mode A: request a reset link (no token in URL) -->
      <form class="login-form" id="forgot-form" hidden>
        <div class="form-group" id="forgot-email-group">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" name="email" placeholder="student@wits.ac.za" autocomplete="email" aria-required="true" aria-describedby="reset-email-error" required />
          <span class="error-msg" id="reset-email-error" role="alert"></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-forgot-submit">Send Reset Link</button>
        </div>
        <div class="reset-message" id="forgot-message" role="status" aria-live="polite"></div>
      </form>

      <!-- Mode B: choose a new password (token present in URL) -->
      <form class="login-form" id="reset-form" hidden>
        <div class="form-group" id="reset-password-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="password" placeholder="At least 6 characters" autocomplete="new-password" aria-required="true" aria-describedby="reset-password-error" required minlength="6" />
          <span class="error-msg" id="reset-password-error" role="alert"></span>
        </div>
        <div class="form-group" id="reset-confirm-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm" placeholder="Re-enter the new password" autocomplete="new-password" aria-required="true" aria-describedby="reset-confirm-error" required />
          <span class="error-msg" id="reset-confirm-error" role="alert"></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-reset-submit">Set New Password</button>
        </div>
        <div class="reset-message" id="reset-message" role="status" aria-live="polite"></div>
      </form>

      <div class="form-footer">
        <p>Remembered it? <a href="login.html">Back to login</a></p>
      </div>
    </div>
  </main>

  <script src="scripts/api.js"></script>
  <script src="scripts/reset-password.js"></script>
</body>
</html>
